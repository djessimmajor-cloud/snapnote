<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mémo">
  <title>Mémo</title>
  <link rel="manifest" href="/snapshot-note/manifest.json">
  <link rel="apple-touch-icon" href="/snapshot-note/icons/icon-192.png">
  <link rel="icon" href="/snapshot-note/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Caveat:wght@400;600&family=Kalam:wght@400&family=Patrick+Hand&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --paper:    #faf8f5;
      --paper2:   #f3f0ea;
      --surface:  #ffffff;
      --ink:      #1c1a16;
      --ink2:     #3a3630;
      --faint:    #9a9590;
      --faint2:   #706c66;
      --line:     #e8e4db;
      --line2:    #d4cfc5;
      --rust:     #c85a2a;
      --rust2:    #a84820;
      --rust-bg:  rgba(200,90,42,.07);
      --red:      #b83030;
      --red-bg:   #fdf0f0;
      --hand:     'Instrument Sans', sans-serif;
      --ui:       'Instrument Sans', system-ui, sans-serif;
      --mono:     'JetBrains Mono', monospace;
      --r:        16px;
      --r-sm:     10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--paper2);
      font-family: var(--ui);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      position: relative;
      width: 100%; height: 100%;
      background: var(--paper);
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bot);
    }

    @media (min-width: 600px) {
      body { display: flex; align-items: center; justify-content: center; background: #ddd9d0; }
      .shell {
        width: 390px;
        height: min(844px, 96vh);
        border-radius: 32px;
        box-shadow: 0 40px 100px rgba(0,0,0,.18), 0 8px 28px rgba(0,0,0,.08);
        padding-top: 0; padding-bottom: 0;
      }
    }

    /* ── SCREENS ──────────────────────────── */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: var(--paper);
      transition: opacity .16s ease, transform .16s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; transform: translateY(8px); }

    /* ── COMMON HEADER ────────────────────── */
    .bar, .top-bar {
      display: flex; align-items: center;
      padding: 14px 18px 12px;
      gap: 8px; flex-shrink: 0;
    }
    .bar-title {
      font-family: var(--ui); font-size: 15px; font-weight: 500;
      color: var(--ink2); flex: 1;
    }

    /* ── ICON BUTTON ──────────────────────── */
    .btn-icon {
      background: none; border: none; cursor: pointer;
      color: var(--faint2); padding: 7px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s;
    }
    .btn-icon:hover { background: var(--paper2); color: var(--ink2); }

    /* ── PRIMARY BUTTON ───────────────────── */
    .btn-primary {
      background: var(--rust); color: #fff;
      border: none; border-radius: var(--r-sm);
      padding: 8px 20px; font-size: 13.5px; font-weight: 500;
      font-family: var(--ui); cursor: pointer;
      transition: background .12s;
    }
    .btn-primary:disabled { background: var(--line2); color: var(--faint); cursor: default; }
    .btn-primary:not(:disabled):hover { background: var(--rust2); }

    /* ── ═══════════════════════════════════ */
    /* ── HOME ─────────────────────────────── */
    /* ── ═══════════════════════════════════ */
    .home-header {
      display: flex; align-items: center;
      padding: 14px 18px 0; gap: 8px; flex-shrink: 0;
    }
    .home-logo {
      font-family: 'Kalam', cursive; font-size: 36px; font-weight: 400;
      color: var(--rust); letter-spacing: .01em;
      flex: 1; text-align: center;
      user-select: none;
    }

    .home-body {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      padding-bottom: 20px;
    }

    .btn-new {
      width: 96px; height: 96px; border-radius: 50%;
      background: var(--rust); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      transition: transform .14s;
    }
    .btn-new:hover { transform: scale(1.07); }
    .btn-new:active { transform: scale(.93); }

    .home-hint {
      font-family: var(--ui); font-size: 13px; font-weight: 400;
      color: var(--faint); letter-spacing: .01em;
    }

    .home-footer { padding: 0 22px 32px; flex-shrink: 0; }

    .last-card {
      width: 100%; text-align: left; cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 18px 20px;
      transition: border-color .14s, box-shadow .14s;
      /* subtle ruled paper lines */
      background-image: repeating-linear-gradient(
        transparent, transparent 27px,
        rgba(200,90,42,.06) 28px
      );
      background-size: 100% 28px;
      background-position: 0 18px;
    }
    .last-card:hover { border-color: var(--line2); box-shadow: 0 4px 20px rgba(0,0,0,.06); }
    .last-card-meta {
      font-family: var(--mono); font-size: 10.5px; color: var(--faint);
      margin-bottom: 10px; letter-spacing: .02em;
    }
    .last-card-text {
      font-family: var(--hand); font-size: 21px; font-weight: 400;
      color: var(--ink2); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .last-empty {
      width: 100%; background: var(--paper2);
      border: 1px dashed var(--line2); border-radius: var(--r);
      padding: 22px; text-align: center;
    }
    .last-empty span { font-family: var(--ui); font-size: 13px; color: var(--faint); }

    /* ── ═══════════════════════════════════ */
    /* ── WRITE ────────────────────────────── */
    /* ── ═══════════════════════════════════ */
    .write-bar {
      display: flex; align-items: center;
      padding: 12px 18px; gap: 10px; flex-shrink: 0;
    }
    .write-count { font-family: var(--mono); font-size: 11px; color: var(--faint); }

    #note-area {
      flex: 1; border: none; outline: none; resize: none;
      background: transparent;
      padding: 8px 24px 20px;
      font-family: var(--user-font, var(--hand)); font-size: var(--user-size, 24px); font-weight: 400;
      line-height: 1.75; color: var(--ink);
      /* ruled lines matching line-height */
      background-image: repeating-linear-gradient(
        transparent, transparent 34px,
        rgba(200,90,42,.08) 35px
      );
      background-size: 100% 35px;
      background-position: 0 8px;
    }
    #note-area::placeholder { color: var(--faint); font-family: var(--ui); font-size: 16px; }

    /* ── BELL BUTTON (dans voice-bar) ──────── */
    .btn-write-bell {
      flex-shrink: 0;
      height: auto; border-radius: 12px;
      padding: 14px 20px; gap: 8px;
      background: var(--surface); border: 1.5px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--faint2);
      font-family: var(--ui); font-size: 15px; font-weight: 500;
      transition: border-color .14s, color .14s, background .14s;
    }
    .btn-write-bell:hover { border-color: var(--rust); color: var(--rust); background: var(--rust-bg); }
    .btn-write-bell.active { background: var(--rust); border-color: var(--rust); color: #fff; }

    /* ── PING SETUP SCREEN ───────────────── */
    .ping-setup-body { flex: 1; overflow-y: auto; padding: 8px 18px 0; }
    .ping-setup-footer { padding: 12px 18px 28px; flex-shrink: 0; }
    .btn-setup-go { width: 100%; padding: 16px; font-size: 16px; border-radius: 14px; }
    .btn-text-skip {
      background: none; border: none; cursor: pointer;
      color: var(--faint2); font-size: 14px; font-family: var(--ui);
      padding: 6px 4px;
    }
    .btn-text-skip:hover { color: var(--ink2); }

    /* ── BELL PANEL ───────────────────────── */
    #bell-panel {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: var(--surface); border-top: 1px solid var(--line2);
      border-radius: 20px 20px 0 0; padding: 16px 16px 24px;
      box-shadow: 0 -8px 32px rgba(0,0,0,.10);
      z-index: 30;
      transform: translateY(100%); opacity: 0; pointer-events: none;
      transform-origin: bottom center;
      transition: transform .22s cubic-bezier(.22,.68,0,1.15), opacity .18s;
    }
    #bell-panel.open { transform: translateY(0); opacity: 1; pointer-events: all; }

    .bell-panel-title {
      font-family: var(--mono); font-size: 10px; color: var(--faint);
      text-transform: uppercase; letter-spacing: .07em;
      margin-bottom: 10px; padding: 0 2px;
    }
    .bell-presets {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px;
    }
    .bell-preset {
      background: var(--paper2); border: 1px solid var(--line);
      border-radius: 20px; padding: 15px 4px;
      font-family: var(--ui); font-size: 16px; color: var(--ink2);
      cursor: pointer; text-align: center;
      transition: border-color .1s, color .1s, background .1s;
    }
    .bell-custom {
      display: flex; gap: 8px; margin-top: 8px; margin-bottom: 12px;
    }
    .bell-custom input {
      flex: 1; border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; font-size: 16px; font-family: var(--ui);
      background: var(--paper2); color: var(--ink); outline: none;
    }
    .bell-custom select {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 10px; font-size: 16px; font-family: var(--ui);
      background: var(--paper2); color: var(--ink2); outline: none; cursor: pointer;
    }
    .bell-custom-ok {
      background: var(--rust); color: #fff; border: none;
      border-radius: 12px; padding: 14px 18px; font-size: 16px;
      cursor: pointer; font-family: var(--ui); white-space: nowrap;
      transition: background .12s;
    }
    .bell-custom-ok:hover { background: var(--rust2); }
    .bell-preset:hover { border-color: var(--line2); }
    .bell-preset.active { background: var(--rust); border-color: var(--rust); color: #fff; }

    .bell-div { height: 1px; background: var(--line); margin: 8px 0; }

    .bell-mode-title {
      font-family: var(--mono); font-size: 10px; color: var(--faint);
      text-transform: uppercase; letter-spacing: .07em;
      margin-bottom: 8px; padding: 0 2px;
    }
    .bell-modes { display: flex; flex-direction: column; gap: 5px; }
    .bell-mode {
      display: flex; align-items: center; gap: 10px;
      background: var(--paper2); border: 1px solid var(--line);
      border-radius: 12px; padding: 13px 14px; cursor: pointer;
      font-size: 15px; font-family: var(--ui); color: var(--faint2);
      transition: border-color .1s, color .1s, background .1s;
    }
    .bell-mode:hover { border-color: var(--line2); color: var(--ink2); }
    .bell-mode.active { background: var(--rust-bg); border-color: var(--rust); color: var(--rust); }
    .bell-mode svg { flex-shrink: 0; }

    /* ── VOICE BAR ────────────────────────── */
    .voice-bar {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; gap: 8px; padding: 8px 18px 18px;
      background: linear-gradient(transparent, var(--paper) 28px);
    }
    .voice-bar.hidden { display: none; }

    .btn-voice {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 8px; border: 1px solid var(--line);
      border-radius: var(--r-sm); padding: 14px 8px;
      background: var(--surface); color: var(--ink2);
      font-size: 15px; font-family: var(--ui); font-weight: 500;
      cursor: pointer; transition: border-color .12s, color .12s, background .12s;
    }
    .btn-voice:hover { border-color: var(--line2); }
    .btn-voice.recording { background: var(--rust-bg); border-color: var(--rust); color: var(--rust); }
    .btn-voice-ai { color: var(--rust); border-color: rgba(200,90,42,.28); }
    .btn-voice-ai:hover { background: var(--rust-bg); border-color: var(--rust); }

    @keyframes pulse-ring {
      0%,100% { box-shadow: 0 0 0 0 rgba(200,90,42,.22); }
      50%      { box-shadow: 0 0 0 5px rgba(200,90,42,.0); }
    }
    .recording { animation: pulse-ring 1.4s ease-in-out infinite; }

    /* ── ═══════════════════════════════════ */
    /* ── LIST ─────────────────────────────── */
    /* ── ═══════════════════════════════════ */
    .list-stats {
      padding: 2px 22px 16px;
      display: flex; gap: 28px; flex-shrink: 0;
    }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-val { font-family: var(--hand); font-size: 26px; font-weight: 600; color: var(--rust); line-height: 1; }
    .stat-lbl { font-size: 11px; color: var(--faint); letter-spacing: .03em; }

    .search-wrap { padding: 0 22px 14px; flex-shrink: 0; }
    .search-inner {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-sm); padding: 10px 14px;
      transition: border-color .12s;
    }
    .search-inner:focus-within { border-color: var(--line2); }
    .search-inner input {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 14px; color: var(--ink2); font-family: var(--ui);
    }
    .search-inner input::placeholder { color: var(--faint); }
    .btn-search-clear { background: none; border: none; cursor: pointer; color: var(--faint); padding: 0; display: flex; }

    .notes-list {
      flex: 1; overflow-y: auto;
      padding: 0 22px 28px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .notes-list::-webkit-scrollbar { width: 3px; }
    .notes-list::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; }

    .note-row { position: relative; }
    .note-card {
      width: 100%; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 14px 18px; text-align: left; cursor: pointer;
      transition: border-color .12s, box-shadow .12s;
      background-image: repeating-linear-gradient(
        transparent, transparent 22px,
        rgba(200,90,42,.05) 23px
      );
      background-size: 100% 23px;
      background-position: 0 14px;
    }
    .note-card:hover { border-color: var(--line2); box-shadow: 0 3px 14px rgba(0,0,0,.05); }
    .note-card-date { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-bottom: 6px; }
    .note-card-text { font-family: var(--user-font, var(--hand)); font-size: calc(var(--user-size, 21px) * 0.88); color: var(--ink2); line-height: 1.5; }

    .note-del {
      position: absolute; right: 48px; top: 50%;
      transform: translateY(-50%);
      background: var(--red-bg); border: none; border-radius: 8px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--red); opacity: 0;
      transition: opacity .12s;
    }
    .note-row:hover .note-del { opacity: 1; }

    .note-bell {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: var(--rust-bg); border: 1.5px solid transparent; border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--rust); opacity: 0;
      transition: opacity .12s, border-color .12s, background .12s;
    }
    .note-bell.has-ping { opacity: 1; border-color: var(--rust); }
    .note-row:hover .note-bell { opacity: 1; }
    .note-bell:hover { background: rgba(200,90,42,.16); }
    .list-empty { text-align: center; color: var(--faint); font-family: var(--ui); font-size: 14px; padding: 52px 0; }

    /* ── ═══════════════════════════════════ */
    /* ── VIEW ─────────────────────────────── */
    /* ── ═══════════════════════════════════ */
    .view-bar {
      display: flex; align-items: center;
      padding: 12px 18px 10px; gap: 8px; flex-shrink: 0;
    }
    .btn-danger-sm {
      background: var(--red-bg); border: none; border-radius: var(--r-sm);
      padding: 7px 12px; cursor: pointer; color: var(--red);
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; font-family: var(--ui);
      transition: background .12s;
    }
    .btn-danger-sm:hover { background: #f5d4d4; }
    .btn-dl {
      background: var(--rust-bg); border: none; border-radius: var(--r-sm);
      padding: 7px 12px; cursor: pointer; color: var(--rust);
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; font-family: var(--ui);
      transition: background .12s;
    }
    .btn-dl:hover { background: rgba(200,90,42,.14); }

    .view-meta { padding: 6px 24px 2px; flex-shrink: 0; }
    .view-date { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

    .view-body {
      flex: 1; overflow-y: auto;
      padding: 16px 24px 28px;
      font-family: var(--user-font, var(--hand)); font-size: var(--user-size, 24px); font-weight: 400;
      line-height: 1.75; color: var(--ink); white-space: pre-wrap;
      background-image: repeating-linear-gradient(
        transparent, transparent 34px,
        rgba(200,90,42,.07) 35px
      );
      background-size: 100% 35px;
      background-position: 0 16px;
    }

    /* ── PING CARD ────────────────────────── */
    .ping-card {
      margin: 0 16px 16px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); padding: 16px 18px 14px; flex-shrink: 0;
    }
    .ping-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .ping-lbl {
      font-size: 11px; font-family: var(--mono); color: var(--faint);
      text-transform: uppercase; letter-spacing: .07em;
    }
    .ping-val { font-family: var(--hand); font-size: 18px; font-weight: 600; color: var(--rust); }
    .ping-presets {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; margin-bottom: 10px;
    }
    .ping-preset {
      background: var(--paper2); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 6px;
      font-family: var(--hand); font-size: 15px; color: var(--ink2);
      cursor: pointer; text-align: center;
      transition: border-color .12s, color .12s, background .12s;
    }
    .ping-preset:hover { border-color: var(--line2); }
    .ping-preset.active { background: var(--rust); border-color: var(--rust); color: #fff; }

    .ping-custom { display: flex; gap: 8px; margin-bottom: 10px; }
    .ping-custom input[type=number] {
      flex: 1; border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 9px 12px; font-size: 14px; font-family: var(--ui);
      background: var(--paper2); color: var(--ink2); outline: none;
      transition: border-color .12s;
    }
    .ping-custom input:focus { border-color: var(--line2); }
    .ping-custom select {
      border: 1px solid var(--line); border-radius: var(--r-sm);
      padding: 9px 10px; font-size: 13px; font-family: var(--ui);
      background: var(--paper2); color: var(--ink2); outline: none; cursor: pointer;
    }
    .btn-ping-ok {
      background: var(--rust); color: #fff; border: none;
      border-radius: var(--r-sm); padding: 9px 14px; font-size: 13px;
      cursor: pointer; font-family: var(--ui); white-space: nowrap;
      transition: background .12s;
    }
    .btn-ping-ok:hover { background: var(--rust2); }

    .ping-after { display: flex; gap: 8px; }
    .ping-after-btn {
      flex: 1; background: var(--paper2); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 6px; font-size: 12px; font-family: var(--ui);
      color: var(--faint2); cursor: pointer; text-align: center;
      line-height: 1.35; display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: border-color .12s, color .12s, background .12s;
    }
    .ping-after-btn.active { background: var(--rust-bg); border-color: var(--rust); color: var(--rust); }
    .ping-after-btn:hover:not(.active) { border-color: var(--line2); }

    /* ── SETTINGS ─────────────────────────── */
    .settings-body { flex: 1; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 24px; }
    .settings-section { display: flex; flex-direction: column; gap: 10px; }
    .settings-label { font-size: 11px; font-weight: 500; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
    .settings-options {
      display: flex; flex-wrap: nowrap; gap: 8px;
      overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .settings-options::-webkit-scrollbar { display: none; }
    .settings-options .set-opt { flex-shrink: 0; }
    .set-opt {
      padding: 9px 16px; border-radius: 12px; border: 1.5px solid var(--line);
      background: var(--surface); color: var(--ink2); font-size: 14px;
      cursor: pointer; transition: all .15s;
    }
    .set-opt:hover { border-color: var(--line2); background: var(--paper2); }
    .set-opt.active { border-color: var(--rust); background: var(--rust-bg); color: var(--rust); font-weight: 500; }
    .set-opt-wide { width: 100%; text-align: left; }
    .set-opt-danger { color: var(--red) !important; border-color: var(--red) !important; }
    .set-opt-danger:hover { background: var(--red-bg) !important; }
    .settings-storage { font-size: 12px; color: var(--faint); margin-top: 8px; }

    /* Thèmes */
    :root[data-theme="dark"] {
      --paper: #1a1814; --paper2: #201e1a; --surface: #252320;
      --ink: #f0ece4; --ink2: #c8c4bc; --faint: #706c66; --faint2: #908c86;
      --line: #2e2c28; --line2: #3a3830;
    }
    :root[data-theme="sepia"] {
      --paper: #f5f0e8; --paper2: #ede8dc; --surface: #faf6ee;
      --ink: #2c2416; --ink2: #4a3c28; --faint: #9a8c78; --faint2: #7a6c58;
      --line: #ddd4c4; --line2: #ccc0ac;
    }

    .settings-preview-wrap { margin-top: 4px; }
    .settings-preview-label { font-size: 11px; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
    .settings-preview {
      background: var(--surface); border-radius: 14px; padding: 18px;
      border: 1px solid var(--line); color: var(--ink); line-height: 1.6;
    }

    /* ── MENU DRAWER ──────────────────────── */
    #menu-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(4px);
      z-index: 50; opacity: 0; pointer-events: none;
      transition: opacity .22s;
    }
    #menu-overlay.open { opacity: 1; pointer-events: all; }

    #menu-drawer {
      position: absolute; top: 0; left: 0; bottom: 0; width: 74%;
      background: var(--paper); z-index: 51;
      display: flex; flex-direction: column;
      box-shadow: 16px 0 60px rgba(0,0,0,.1);
      transform: translateX(-100%);
      transition: transform .26s cubic-bezier(.22,.68,0,1.12);
      border-right: 1px solid var(--line);
    }
    #menu-drawer.open { transform: translateX(0); }

    .menu-top {
      padding: 22px 20px 14px;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .menu-logo { font-family: 'Kalam', cursive; font-size: 26px; font-weight: 400; color: var(--rust); }

    .menu-badges { padding: 0 20px 16px; display: flex; gap: 8px; flex-shrink: 0; }
    .menu-badge {
      background: var(--rust-bg); border-radius: 20px;
      padding: 4px 10px; font-family: var(--hand); font-size: 14px; color: var(--rust);
    }

    .menu-div { height: 1px; background: var(--line); margin: 0 20px 8px; flex-shrink: 0; }

    .menu-nav { flex: 1; overflow-y: auto; padding: 4px 12px; }
    .menu-btn {
      width: 100%; background: none; border: none; border-radius: var(--r-sm);
      padding: 13px 12px; text-align: left; cursor: pointer;
      font-family: var(--ui); font-size: 15px; color: var(--ink2);
      transition: background .1s; display: block;
    }
    .menu-btn:hover { background: var(--paper2); }

    .menu-actions { padding: 6px 12px 32px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
    .menu-action {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: none; border-radius: var(--r-sm);
      padding: 12px 12px; text-align: left; cursor: pointer;
      font-size: 13.5px; color: var(--faint2); font-family: var(--ui);
      transition: background .1s, color .1s;
    }
    .menu-action:hover { background: var(--paper2); color: var(--ink2); }
    .menu-action.danger { color: var(--red); }
    .menu-action.danger:hover { background: var(--red-bg); }

    .confirm-clear { padding: 10px 12px; background: var(--red-bg); border-radius: var(--r-sm); }
    .confirm-msg { font-size: 13px; color: #7a2020; margin-bottom: 10px; line-height: 1.45; }
    .confirm-row { display: flex; gap: 8px; }
    .btn-cancel {
      flex: 1; background: #fff; border: 1px solid var(--line2);
      border-radius: 8px; padding: 8px; font-size: 12.5px; cursor: pointer; font-family: var(--ui);
    }
    .btn-confirm-del {
      flex: 1; background: var(--red); color: #fff; border: none;
      border-radius: 8px; padding: 8px; font-size: 12.5px; cursor: pointer; font-family: var(--ui);
    }

    .menu-transfer-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: var(--rust-bg); border: 1px solid rgba(200,90,42,.2); border-radius: var(--r-sm);
      padding: 13px 14px; text-align: left; cursor: pointer;
      font-size: 14px; color: var(--rust); font-family: var(--ui); font-weight: 500;
      transition: background .1s, border-color .1s;
    }
    .menu-transfer-btn:hover { background: rgba(200,90,42,.14); border-color: var(--rust); }

    /* ── INSTALL BANNER ───────────────────── */
    #install-banner {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--line);
      padding: 14px 20px calc(24px + var(--safe-bot));
      display: flex; align-items: center; gap: 12px;
      z-index: 100; transform: translateY(100%);
      transition: transform .28s cubic-bezier(.22,.68,0,1.15);
    }
    #install-banner.show { transform: translateY(0); }
    .install-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: var(--rust-bg); display: flex; align-items: center; justify-content: center;
      color: var(--rust); flex-shrink: 0;
    }
    .install-text { flex: 1; }
    .install-text strong { font-size: 13px; font-weight: 500; color: var(--ink2); display: block; font-family: var(--ui); }
    .install-text span { font-size: 12px; color: var(--faint); font-family: var(--ui); }
    .btn-install {
      background: var(--rust); color: #fff; border: none;
      border-radius: var(--r-sm); padding: 9px 16px; font-size: 13px; font-weight: 500;
      font-family: var(--ui); cursor: pointer; white-space: nowrap; transition: background .12s;
    }
    .btn-install:hover { background: var(--rust2); }
    .btn-install-close { background: none; border: none; cursor: pointer; color: var(--faint); padding: 4px; }

    /* ── AI THINKING ──────────────────────── */
    .thinking { display: inline-flex; gap: 4px; align-items: center; }
    .thinking span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--rust);
      animation: blink 1.2s ease-in-out infinite;
    }
    .thinking span:nth-child(2) { animation-delay: .2s; }
    .thinking span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{ opacity:.18 } 40%{ opacity:1 } }

    /* ── TOAST ────────────────────────────── */
    #toast {
      position: fixed; bottom: 38px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--ink); color: #fff;
      border-radius: 22px; padding: 10px 22px;
      font-family: var(--ui); font-size: 13px;
      z-index: 300; opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="shell" id="shell">

  <!-- ══ HOME ══════════════════════════════ -->
  <div class="screen" id="home">
    <div class="home-header">
      <button class="btn-icon" id="btn-menu" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="home-body">
      <button class="btn-new" id="btn-write" aria-label="Nouvelle note">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
    <div class="home-footer">
      <div id="last-preview"></div>
    </div>
  </div>

  <!-- ══ PING SETUP ════════════════════════ -->
  <div class="screen hidden" id="ping-setup">
    <div class="bar">
      <button class="btn-icon btn-back" id="back-ping-setup" aria-label="Retour"></button>
      <span class="bar-title">Rappel</span>
      <button class="btn-text-skip" id="skip-ping-setup">Passer</button>
    </div>
    <div class="ping-setup-body">
      <div class="bell-panel-title">Délai</div>
      <div class="bell-presets" id="setup-presets"></div>
      <div class="bell-custom">
        <input type="number" id="setup-custom-val" min="1" max="999" placeholder="ex. 3">
        <select id="setup-custom-unit">
          <option value="min">min</option>
          <option value="h">heures</option>
          <option value="d">jours</option>
          <option value="w">semaines</option>
        </select>
        <button class="bell-custom-ok" id="setup-custom-ok">OK</button>
      </div>
      <div class="bell-div"></div>
      <div class="bell-mode-title">Action</div>
      <div class="bell-modes" id="setup-modes">
        <button class="bell-mode active" data-mode="notif" id="sm-notif">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Notif seule
        </button>
        <button class="bell-mode" data-mode="notif-del" id="sm-notif-del">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="18" y1="6" x2="23" y2="11"/><line x1="23" y1="6" x2="18" y2="11"/></svg>
          Notif + supprimer
        </button>
        <button class="bell-mode" data-mode="del" id="sm-del">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Supprimer seul
        </button>
      </div>
    </div>
    <div class="ping-setup-footer">
      <button class="btn-primary btn-setup-go" id="btn-setup-go">Écrire →</button>
    </div>
  </div>

  <!-- ══ WRITE ══════════════════════════════ -->
  <div class="screen hidden" id="write">
    <div class="write-bar">
      <button class="btn-icon btn-back" id="back-write" aria-label="Retour"></button>
      <span style="flex:1"></span>
      <span class="write-count" id="char-count">0</span>
      <button class="btn-primary" id="btn-save" disabled>Enregistrer</button>
    </div>
    <textarea id="note-area" placeholder="Commence à écrire…" autocomplete="off" spellcheck="true"></textarea>
    <div style="height:68px;flex-shrink:0"></div>

  </div>

  <!-- Voice bar (dans shell, pas dans write) -->
  <div class="voice-bar hidden" id="voice-bar">
    <!-- Bell button -->
    <button class="btn-write-bell" id="btn-write-bell" aria-label="Rappel">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      Ping
    </button>
    <button class="btn-voice" id="btn-voice-raw">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
      Dicter
    </button>
  </div>

  <!-- Bell panel (dans shell, au-dessus du clavier) -->
  <div id="bell-panel">
    <div class="bell-panel-title">Délai</div>
    <div class="bell-presets" id="bell-presets"></div>
    <div class="bell-custom">
      <input type="number" id="bell-custom-val" min="1" max="999" placeholder="ex. 3">
      <select id="bell-custom-unit">
        <option value="min">min</option>
        <option value="h">heures</option>
        <option value="d">jours</option>
        <option value="w">semaines</option>
      </select>
      <button class="bell-custom-ok" id="bell-custom-ok">OK</button>
    </div>
    <div class="bell-div"></div>
    <div class="bell-mode-title">Action</div>
    <div class="bell-modes">
      <button class="bell-mode active" data-mode="notif" id="bm-notif">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        Notif seule
      </button>
      <button class="bell-mode" data-mode="notif-del" id="bm-notif-del">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          <line x1="4" y1="4" x2="20" y2="20"/>
        </svg>
        Notif + supprimer
      </button>
      <button class="bell-mode" data-mode="del" id="bm-del">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
        </svg>
        Supprimer seul
      </button>
    </div>
  </div>

  <!-- ══ LIST ═══════════════════════════════ -->
  <div class="screen hidden" id="list">
    <div class="bar">
      <button class="btn-icon btn-back" id="back-list" aria-label="Retour"></button>
      <span class="bar-title">Mes mémos</span>
    </div>
    <div class="list-stats" id="list-stats"></div>
    <div class="search-wrap">
      <div class="search-inner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Rechercher…">
        <button class="btn-search-clear" id="btn-search-clear" style="display:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="notes-list" id="notes-list"></div>
  </div>

  <!-- ══ VIEW ════════════════════════════════ -->
  <div class="screen hidden" id="view">
    <div class="view-bar">
      <button class="btn-icon btn-back" id="back-view" aria-label="Retour"></button>
      <span style="flex:1"></span>
      <button class="btn-dl" id="btn-dl">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Exporter
      </button>
      <button class="btn-danger-sm" id="btn-delete">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/>
        </svg>
        Supprimer
      </button>
    </div>
    <div class="view-meta"><div class="view-date" id="view-date"></div></div>
    <div class="view-body" id="view-body"></div>
    <div class="ping-card" id="ping-card">
      <div class="bell-panel-title">Délai</div>
      <div class="bell-presets" id="ping-presets"></div>
      <div class="bell-custom">
        <input type="number" id="ping-custom-val" min="1" max="999" placeholder="ex. 3">
        <select id="ping-custom-unit">
          <option value="min">min</option>
          <option value="h">heures</option>
          <option value="d">jours</option>
          <option value="w">semaines</option>
        </select>
        <button class="bell-custom-ok" id="ping-custom-ok">OK</button>
      </div>
      <div class="bell-div"></div>
      <div class="bell-mode-title">Action</div>
      <div class="bell-modes">
        <button class="bell-mode" id="pm-notif" data-after="notif">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          Notif seule
        </button>
        <button class="bell-mode" id="pm-notif-del" data-after="warn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            <line x1="4" y1="4" x2="20" y2="20"/>
          </svg>
          Notif + supprimer
        </button>
        <button class="bell-mode" id="pm-del" data-after="delete">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
          </svg>
          Supprimer seul
        </button>
      </div>
    </div>
  </div>

  <!-- ══ SETTINGS ════════════════════════════ -->
  <div id="settings" class="screen hidden">
    <div class="top-bar">
      <button class="btn-icon" id="btn-back-settings" aria-label="Retour">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="bar-title">Paramètres</span>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-label">Police d'écriture</div>
        <div class="settings-options" id="set-font">
          <button class="set-opt" data-val="'Instrument Sans', sans-serif" style="font-family:'Instrument Sans',sans-serif">Normal</button>
          <button class="set-opt" data-val="'Caveat', cursive" style="font-family:'Caveat',cursive;font-size:17px">Manuscrit</button>
          <button class="set-opt" data-val="'Kalam', cursive" style="font-family:'Kalam',cursive">Naturel</button>
          <button class="set-opt" data-val="'Patrick Hand', cursive" style="font-family:'Patrick Hand',cursive">Doux</button>
          <button class="set-opt" data-val="'JetBrains Mono', monospace" style="font-family:'JetBrains Mono',monospace;font-size:12px">Mono</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Taille d'écriture</div>
        <div class="settings-options" id="set-size">
          <button class="set-opt" data-val="16">Petite</button>
          <button class="set-opt" data-val="20">Normale</button>
          <button class="set-opt" data-val="24">Grande</button>
          <button class="set-opt" data-val="28">Très grande</button>
        </div>
      </div>
      <div class="settings-preview-wrap">
        <div class="settings-preview-label">Aperçu</div>
        <div class="settings-preview" id="set-preview">Le vif renard brun saute par-dessus le chien paresseux.</div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Interligne</div>
        <div class="settings-options" id="set-line">
          <button class="set-opt" data-val="1.3">Serré</button>
          <button class="set-opt" data-val="1.6">Normal</button>
          <button class="set-opt" data-val="2.0">Aéré</button>
          <button class="set-opt" data-val="2.5">Très aéré</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Thème</div>
        <div class="settings-options" id="set-theme">
          <button class="set-opt" data-val="light">Clair</button>
          <button class="set-opt" data-val="dark">Sombre</button>
          <button class="set-opt" data-val="sepia">Sépia</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Action rappel par défaut</div>
        <div class="settings-options" id="set-ping-action">
          <button class="set-opt" data-val="notif">Notif seule</button>
          <button class="set-opt" data-val="notif-del">Notif + supprimer</button>
          <button class="set-opt" data-val="delete">Supprimer seul</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Données</div>
        <div class="settings-options" style="flex-direction:column">
          <button class="set-opt set-opt-wide" id="set-export-all">Exporter tous les mémos (.txt)</button>
          <button class="set-opt set-opt-wide set-opt-danger" id="set-clear-all">Effacer tous les mémos</button>
        </div>

<script>
const NOTES_KEY = 'memo_notes_v1';
const PRESETS = [
  { label: '5 min',  ms: 300000 },
  { label: '30 min', ms: 1800000 },
  { label: '1 h',    ms: 3600000 },
  { label: '6 h',    ms: 21600000 },
  { label: '1 j',    ms: 86400000 },
  { label: '1 sem',  ms: 604800000 },
];
const UNIT_MS = { min: 60000, h: 3600000, d: 86400000, w: 604800000, mo: 2629800000 };

let notes = (() => { try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || []; } catch { return []; } })();
let prevScreen = 'home';
let pingTimers = {};
let confirmingClear = false;

function persist() { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }

function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
    + ' · ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function msLabel(ms) {
  const s = ms / 1000;
  if (s < 60)       return `${Math.round(s)}s`;
  if (s < 3600)     return `${Math.round(s/60)}min`;
  if (s < 86400)    return `${Math.round(s/3600)}h`;
  if (s < 604800)   return `${Math.round(s/86400)}j`;
  if (s < 2592000)  return `${Math.round(s/604800)}sem`;
  if (s < 31536000) return `${Math.round(s/2592000)}mois`;
  return `${Math.round(s/31536000)}an`;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastTimer;
const toastEl = document.getElementById('toast');
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

const SCREENS = { home: 'home', 'ping-setup': 'ping-setup', write: 'write', list: 'list', view: 'view', settings: 'settings' };
const BACK_SVG = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;

function show(name) {

}

function renderHome() {

    el.innerHTML = `<button class="last-card" id="last-card-btn">

/* Bell panel logic */
const BELL_PRESETS = [

document.getElementById('bell-custom-ok').onclick = () => {

document.getElementById('ping-custom-ok').onclick = () => {
  const val = +document.getElementById('ping-custom-val').value;

  if (!val || val <= 0) return;
  const ms = val * (UNIT_MS[unit] || 60000);

document.addEventListener('click', e => {
  const panel = document.getElementById('bell-panel');
  const bell  = document.getElementById('btn-write-bell');
  if (!panel.contains(e.target) && e.target !== bell) panel.classList.remove('open');

function saveNote() {
  const text = document.getElementById('note-area').value.trim();
  if (!text) return;
  const note = { id: Date.now(), ts: Date.now(), text };
  if (pendingPingMs) {
    note.ping = pendingPingMs;
    note.pingAfter = pendingPingMode === 'notif' ? 'warn'
                   : pendingPingMode === 'notif-del' ? 'delete'
                   : 'silent-delete';
    note.pingDeadline = Date.now() + pendingPingMs;
    pendingPingMs = null;
    pendingPingMode = 'notif';
    document.getElementById('btn-write-bell').classList.remove('active');
    document.getElementById('bell-panel').classList.remove('open');
  }
  notes.unshift(note); persist(); renderHome();
  if (note.ping) { schedulePing(note); toast('Mémo enregistré — rappel dans ' + msLabel(note.ping)); }
  else toast('Mémo enregistré');
  show('home');
}
document.getElementById('btn-save').onclick = saveNote;

let recognition = null, voiceMode = null, silenceTimer = null, accumulated = '';
const SILENCE_MS = 10000;

function startVoice(mode) {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    toast('Dictée non supportée sur ce navigateur'); return;
  }
  if (voiceMode) { finishVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'fr-FR'; recognition.continuous = true; recognition.interimResults = false;
  voiceMode = mode; accumulated = '';
  setVoiceUI(mode, true);
  recognition.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const part = e.results[i][0].transcript.replace(/\s+/g,' ').trim();
        accumulated += (accumulated ? ' ' : '') + part;
      }
    }
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(finishVoice, SILENCE_MS);
  };
  recognition.onerror = e => { if (e.error !== 'no-speech') { stopVoice(); toast('Erreur microphone'); } };
  recognition.onend = () => { if (voiceMode) recognition.start(); };
  recognition.start();
  silenceTimer = setTimeout(finishVoice, SILENCE_MS);
}

async function finishVoice() {
  clearTimeout(silenceTimer);
  const mode = voiceMode, text = accumulated;
  stopVoice();
  if (!text) return;
  if (mode === 'raw') {
    const ta = document.getElementById('note-area');
    ta.value += (ta.value ? '\n' : '') + text;
    ta.dispatchEvent(new Event('input'));
  } else {
    const btnAi = document.getElementById('btn-voice-ai');
    btnAi.innerHTML = `<span class="thinking"><span></span><span></span><span></span></span> IA…`;
    btnAi.disabled = true;
    try {
      const result = await callAI(text);
      const ta = document.getElementById('note-area');
      ta.value = result.text; ta.dispatchEvent(new Event('input'));
      if (result.pingMs) { pendingPingMs = result.pingMs; toast('Mémo prêt — rappel dans ' + msLabel(result.pingMs)); }
      else toast('Mémo prêt');
    } catch {
      const ta = document.getElementById('note-area');
      ta.value = text; ta.dispatchEvent(new Event('input'));
      toast('Mémo prêt');
    } finally { setVoiceUI(null, false); }
  }
}

function stopVoice() {
  clearTimeout(silenceTimer);
  if (recognition) { try { recognition.stop(); } catch {} recognition = null; }
  voiceMode = null; accumulated = '';
  setVoiceUI(null, false);
}

const MIC_SVG  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`;
const AI_SVG   = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>`;
const STOP_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>`;

function setVoiceUI(mode, recording) {
  const raw = document.getElementById('btn-voice-raw');
  raw.classList.remove('recording');
  raw.disabled = false;
  if (recording && mode === 'raw') {
    raw.innerHTML = STOP_SVG + ' Arrêter'; raw.classList.add('recording');
  } else {
    raw.innerHTML = MIC_SVG + ' Dicter';
  }
}

function extractPingMs(text) {
  const t = text.toLowerCase(), h = new Date().getHours();
  const mMin = t.match(/dans\s+(\d+)\s*min/); if (mMin) return +mMin[1]*60000;
  const mH   = t.match(/dans\s+(\d+)\s*(?:heure?s?|h\b)/); if (mH) return +mH[1]*3600000;
  const mAt  = t.match(/[àa]\s+(\d{1,2})\s*h/); if (mAt) { const d = (+mAt[1]-h)*3600000; return d>0?d:null; }
  if (/ce\s*soir/.test(t))  return Math.max(0,(20-h)*3600000);
  if (/demain/.test(t))     return 86400000;
  if (/semaine\s*prochaine|la\s*semaine/.test(t)) return 604800000;
  return null;
}

async function callAI(transcript) {
  const resp = await fetch('/api/ai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ transcript }),
    signal: AbortSignal.timeout(15000)
  });
  if (!resp.ok) throw new Error('API error');
  const data = await resp.json();
  return { text: (data.text || transcript).replace(/\s+/g,' ').trim(), pingMs: extractPingMs(transcript) };
}

document.getElementById('btn-voice-raw').onclick = () => startVoice('raw');

/* Quick ping popup depuis la liste */
let quickPingPopup = null;
function openQuickPing(noteId, bellBtn) {
  if (quickPingPopup) { quickPingPopup.remove(); quickPingPopup = null; return; }
  const note = notes.find(n => n.id === noteId); if (!note) return;
  const pop = document.createElement('div');
  pop.style.cssText = `
    position:absolute; z-index:200;
    background:var(--surface); border:1px solid var(--line2);
    border-radius:14px; padding:10px 8px; box-shadow:0 8px 32px rgba(0,0,0,.12);
    display:flex; gap:6px; flex-wrap:wrap; max-width:220px;
  `;
  const presets = [
    { label:'5 min', ms:300000 },
    { label:'30 min', ms:1800000 },
    { label:'1 h', ms:3600000 },
    { label:'1 j', ms:86400000 },
  ];
  presets.forEach(p => {
    const b = document.createElement('button');
    b.textContent = p.label;
    b.style.cssText = `
      background:${note.ping===p.ms?'var(--rust)':'var(--paper2)'};
      color:${note.ping===p.ms?'#fff':'var(--ink2)'};
      border:1px solid ${note.ping===p.ms?'var(--rust)':'var(--line)'};
      border-radius:20px; padding:6px 12px;
      font-family:var(--ui); font-size:14px; cursor:pointer;
    `;
    b.onclick = (e) => {
      e.stopPropagation();
      setPing(noteId, p.ms, note.pingAfter || 'warn');
      bellBtn.classList.add('has-ping');
      pop.remove(); quickPingPopup = null;
    };
    pop.appendChild(b);
  });
  /* positionner à l'intérieur du shell, au-dessus du bouton cloche */
  const shell = document.getElementById('shell');
  const shellRect = shell.getBoundingClientRect();
  const rect = bellBtn.getBoundingClientRect();
  const topInShell = rect.bottom - shellRect.top + 6;
  const rightInShell = shellRect.right - rect.right;
  pop.style.top  = topInShell + 'px';
  pop.style.right = rightInShell + 'px';
  shell.appendChild(pop);
  quickPingPopup = pop;
  const close = (e) => { if (!pop.contains(e.target) && e.target !== bellBtn) { pop.remove(); quickPingPopup = null; document.removeEventListener('click', close); } };
  setTimeout(() => document.addEventListener('click', close), 0);
}

function openList() { renderList(notes); show('list'); }

function renderList(list = notes) {
  const chars = notes.reduce((a, n) => a + n.text.length, 0);
  document.getElementById('list-stats').innerHTML = '';
  const el = document.getElementById('notes-list');
  if (!list.length) {
    const q = document.getElementById('search-input').value;
    el.innerHTML = `<div class="list-empty">${q ? 'Aucun résultat' : 'Aucun mémo'}</div>`;
    return;
  }
  el.innerHTML = list.map(n => {
    const ex = n.text.length > 80 ? n.text.slice(0,80).trimEnd() + '…' : n.text;
    return `<div class="note-row" data-id="${n.id}">
      <button class="note-card" data-id="${n.id}" style="padding-right:90px">
        <div class="note-card-date">${fmtDate(n.ts)}</div>
        <div class="note-card-text">${esc(ex)}</div>
      </button>
      <button class="note-bell${n.ping ? ' has-ping' : ''}" data-bell="${n.id}" aria-label="Rappel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
      <button class="note-del" data-del="${n.id}" aria-label="Supprimer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
        </svg>
      </button>
    </div>`;
  }).join('');
  el.querySelectorAll('.note-card').forEach(c => c.onclick = () => openView(+c.dataset.id, 'list'));
  el.querySelectorAll('.note-del').forEach(b => b.onclick = e => { e.stopPropagation(); deleteNote(+b.dataset.del); });
  el.querySelectorAll('.note-bell').forEach(b => b.onclick = e => {
    e.stopPropagation();
    openQuickPing(+b.dataset.bell, b);
  });
}

  if (!document.getElementById('list').classList.contains('hidden')) renderList(notes);
  toast('Mémo supprimé');
}

function openView(id, from) {
  const note = notes.find(n => n.id === id);

  document.getElementById('view-body').textContent = note.text;

function renderPingCard(note) {
  const ping = note.ping || null, after = note.pingAfter || 'notif';
  document.getElementById('ping-presets').innerHTML = PRESETS.map(p =>
    `<button class="bell-preset${ping===p.ms?' active':''}" data-ms="${p.ms}">${p.label}</button>`
  ).join('');
  document.querySelectorAll('#ping-presets .bell-preset').forEach(b => b.onclick = () => {
    setPing(note.id, +b.dataset.ms, note.pingAfter || 'notif');
    renderPingCard(notes.find(n => n.id === note.id));
  });
  ['pm-notif','pm-notif-del','pm-del'].forEach(id => {
    const btn = document.getElementById(id);
    btn.classList.toggle('active', btn.dataset.after === after);
    btn.onclick = () => { setPingAfter(note.id, btn.dataset.after); renderPingCard(notes.find(n=>n.id===note.id)); };
  });
}


function setPing(id, ms, after) {
  const note = notes.find(n => n.id === id); if (!note) return;
  note.ping = ms; note.pingAfter = after || 'warn'; note.pingDeadline = Date.now() + ms;
  persist(); schedulePing(note); toast('Rappel : ' + msLabel(ms));
}

function setPingAfter(id, after) {
  const note = notes.find(n => n.id === id); if (!note) return;
  note.pingAfter = after; persist();
}

function schedulePing(note) {
  if (pingTimers[note.id]) clearTimeout(pingTimers[note.id]);
  if (!note.ping) return;
  const delay = note.pingDeadline ? Math.max(0, note.pingDeadline - Date.now()) : note.ping;
  if (delay <= 0) { firePing(note); return; }
  pingTimers[note.id] = setTimeout(() => firePing(note), delay);
}

function firePing(note) {
  const n = notes.find(x => x.id === note.id); if (!n) return;
  const body = n.text.slice(0, 60) + (n.text.length > 60 ? '…' : '');
  if (n.pingAfter === 'silent-delete') {
    deleteNote(n.id);
  } else if (n.pingAfter === 'delete') {
    if ('Notification' in window && Notification.permission === 'granted')
      new Notification('Mémo supprimé', { body, icon: 'icons/icon-192.png' });
    deleteNote(n.id);
  } else {
    if ('Notification' in window && Notification.permission === 'granted')
      new Notification('Rappel mémo', { body, icon: 'icons/icon-192.png' });
    n.ping = null; n.pingDeadline = null;
    persist();
  }
}

document.getElementById('back-view').onclick = () => { if (prevScreen === 'list') openList(); else show('home'); };
document.getElementById('btn-delete').onclick = function() {
  const id = +this.dataset.id; if (!id) return;
  deleteNote(id);
  if (prevScreen === 'list') openList(); else show('home');
};
document.getElementById('btn-dl').onclick = function() {
  const id = +this.dataset.id;
  const note = notes.find(n => n.id === id); if (!note) return;
  const blob = new Blob([`[${fmtDate(note.ts)}]\n\n${note.text}`], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `memo-${new Date(note.ts).toISOString().slice(0,10)}.txt`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('Mémo exporté');
};

function setMenu(open) {
  document.getElementById('menu-overlay').classList.toggle('open', open);
  document.getElementById('menu-drawer').classList.toggle('open', open);
}
document.getElementById('btn-menu').onclick        = () => setMenu(true);
document.getElementById('btn-close-menu').onclick  = () => setMenu(false);
document.getElementById('menu-overlay').onclick    = () => setMenu(false);
document.getElementById('mn-home').onclick     = () => { setMenu(false); show('home'); };
document.getElementById('mn-new').onclick      = () => { setMenu(false); openWrite(); };
document.getElementById('mn-list').onclick     = () => { setMenu(false); openList(); };
document.getElementById('mn-settings').onclick = () => { setMenu(false); openSettings(); };
document.getElementById('btn-back-settings').onclick = () => show('home');

document.getElementById('mn-transfer').onclick = () => {
  setMenu(false);
  if (!notes.length) { toast('Aucun mémo à transférer'); return; }
  const content = notes.map(n => `[${fmtDate(n.ts)}]\n${n.text}`).join('\n\n---\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
  a.download = `memos-${new Date().toISOString().slice(0,10)}.txt`;
  a.click(); toast('Mémos transférés');
};

let deferredInstall = null;
const installBanner = document.getElementById('install-banner');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstall = e;
  installBanner.classList.add('show');
});

async function triggerInstall() {
  if (deferredInstall) {
    deferredInstall.prompt();
    const { outcome } = await deferredInstall.userChoice;
    if (outcome === 'accepted') installBanner.classList.remove('show');
    deferredInstall = null;
  } else if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
    toast('Application déjà installée');
  } else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    toast('iOS : "Partager" puis "Sur l\'écran d\'accueil"');
  } else {
    toast('Cliquez sur ⊕ dans la barre d\'adresse');
  }
}

document.getElementById('btn-install').onclick      = triggerInstall;
document.getElementById('btn-install-close').onclick = () => installBanner.classList.remove('show');

if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}

// ── Paramètres ─────────────────────────────────────────────────────────────
const SETTING_DEFAULTS = { font: "'Instrument Sans', sans-serif", size: '20', line: '1.6', theme: 'light', pingAction: 'notif' };
let userSettings = { ...SETTING_DEFAULTS, ...JSON.parse(localStorage.getItem('memo_settings') || '{}') };

function applySettings() {
  const area = document.getElementById('note-area');
  area.style.fontFamily = userSettings.font;
  area.style.fontSize   = userSettings.size + 'px';
  area.style.lineHeight = userSettings.line;
  document.documentElement.style.setProperty('--user-font', userSettings.font);
  document.documentElement.style.setProperty('--user-size', userSettings.size + 'px');
  document.documentElement.style.setProperty('--user-line', userSettings.line);
  document.documentElement.setAttribute('data-theme', userSettings.theme);
}

function saveSettings() {
  localStorage.setItem('memo_settings', JSON.stringify(userSettings));
  applySettings();
}

function openSettings() {
  show('settings');
  const preview = document.getElementById('set-preview');
  preview.style.fontFamily = userSettings.font;
  preview.style.fontSize   = userSettings.size + 'px';
  preview.style.lineHeight = userSettings.line;

  function bindOpts(groupId, key, onApply) {
    document.querySelectorAll(`#${groupId} .set-opt`).forEach(btn => {
      btn.classList.toggle('active', btn.dataset.val === userSettings[key]);
      btn.onclick = () => {
        userSettings[key] = btn.dataset.val;
        saveSettings();
        if (onApply) onApply(btn.dataset.val);
        document.querySelectorAll(`#${groupId} .set-opt`).forEach(b => b.classList.toggle('active', b === btn));
      };
    });
  }

  bindOpts('set-font', 'font', v => preview.style.fontFamily = v);
  bindOpts('set-size', 'size', v => preview.style.fontSize = v + 'px');
  bindOpts('set-line', 'line', v => preview.style.lineHeight = v);
  bindOpts('set-theme', 'theme');
  bindOpts('set-ping-action', 'pingAction');

  const nb = notes.length;
  const chars = notes.reduce((a, n) => a + n.text.length, 0);
  document.getElementById('set-storage').textContent = `${nb} mémo${nb!==1?'s':''} · ${chars.toLocaleString('fr')} caractères`;

  document.getElementById('set-export-all').onclick = () => {
    const txt = notes.map(n => `[${fmtDate(n.ts)}]\n${n.text}`).join('\n\n---\n\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'memos.txt'; a.click();
  };

  document.getElementById('set-clear-all').onclick = () => {
    if (!confirm(`Effacer les ${nb} mémo${nb!==1?'s':''} ? Cette action est irréversible.`)) return;
    notes.length = 0; persist(); renderHome();
    document.getElementById('set-storage').textContent = '0 mémo · 0 caractère';
    toast('Tous les mémos effacés');
  };
}

applySettings();

notes.forEach(n => { if (n.ping && n.pingDeadline) schedulePing(n); });
renderHome();

/* ── Keyboard avoidance ─────────────────────────────────────────── */
if (window.visualViewport) {
  function onViewport() {
    const vv = window.visualViewport;
    const shell = document.getElementById('shell');
    const shellRect = shell.getBoundingClientRect();
    const vvBottom = vv.offsetTop + vv.height;
    const shellBottom = shellRect.bottom;
    const gap = Math.max(0, shellBottom - vvBottom);
    const voiceBar = document.getElementById('voice-bar');
    const bellPanel = document.getElementById('bell-panel');
    voiceBar.style.bottom  = gap + 'px';
    bellPanel.style.bottom = gap + 'px';
  }
  window.visualViewport.addEventListener('resize', onViewport);
  window.visualViewport.addEventListener('scroll', onViewport);
}
</script>
