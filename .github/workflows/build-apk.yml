name: Build APK

on:
  push:
    paths:
      - 'memo-apk/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memo-apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: memo-apk/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Wait and download APK
        run: |
          BUILD_ID=$(eas build:list --platform android --status finished --limit 1 --json | jq -r '.[0].id')
          echo "Build ID: $BUILD_ID"
          URL=$(eas build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl')
          echo "APK URL: $URL"
          curl -L "$URL" -o memo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: memo-apk
          path: memo-apk/memo.apk
          retention-days: 7
