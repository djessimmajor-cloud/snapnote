name: Build Notes APK

on:
  push:
    paths:
      - 'notes-apk/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Wait and download APK
        run: |
          sleep 30
          BUILD_ID=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive | jq -r '.[0].id')
          echo "Build ID: $BUILD_ID"
          URL=$(eas build:view $BUILD_ID --json | jq -r '.artifacts.buildUrl')
          echo "APK URL: $URL"
          curl -L "$URL" -o notes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notes-apk
          path: notes-apk/notes.apk
          retention-days: 7
